name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"   # weekly: new advisories for the locked dependencies

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from the hash-locked requirements
        run: |
          pip install --require-hashes -r requirements/build.txt
          pip install --require-hashes --no-deps --no-build-isolation -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests
      - run: pytest -q

  audit:
    name: pip-audit (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the audit tools (hash-locked)
        run: pip install --require-hashes --no-deps -r requirements/tools.txt
      - name: Audit the locked requirements
        # Fails on any known vulnerability. The only exceptions are listed, with reasons, in requirements/pip-audit-ignore.txt.
        run: |
          ignores=()
          while read -r id reason; do
            case "$id" in ''|'#'*) continue ;; esac
            [ -n "$reason" ] || { echo "pip-audit-ignore.txt: $id has no reason" >&2; exit 1; }
            ignores+=(--ignore-vuln "$id")
          done < requirements/pip-audit-ignore.txt
          pip-audit --require-hashes --disable-pip -r requirements/runtime.txt -r requirements/dev.txt "${ignores[@]}"

  bandit:
    name: bandit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements/tools.txt
      - name: bandit (medium severity and up; noise is excluded in .bandit.yaml)
        run: bandit -r src -ll -c .bandit.yaml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (release binary, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history with .gitleaks.toml
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact -c .gitleaks.toml .'
