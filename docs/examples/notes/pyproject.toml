[project]
name = "notes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "agentpg-kit>=0.2.5",
  "uvicorn>=0.30",
]

[project.scripts]
notes = "notes.app:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]
