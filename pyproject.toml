[project]
name = "agentpg-kit"
dynamic = ["version"]
description = "Small reusable blocks for apps on AgentPG: config, Postgres, migrations, secrets vault, outbound-URL guard, LLM client, security middleware, metrics and federated (OIDC) authentication."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "cryptography>=43",
  "prometheus-client>=0.20",
  "authlib>=1.3",
  "joserfc>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/apgkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/apgkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]
